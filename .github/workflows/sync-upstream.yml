name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream (tsukinaha/tsukimi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/tsukinaha/tsukimi.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Update sync branch
        run: |
          if git ls-remote --exit-code --heads origin sync/upstream >/dev/null 2>&1; then
            git fetch origin sync/upstream
            git checkout -B sync/upstream origin/sync/upstream
          else
            git checkout -b sync/upstream
          fi

          # Keep fork-specific commits from main in the sync branch.
          if git merge --no-ff --no-edit main; then
            echo "Merged main into sync branch."
          else
            echo "::error::Merge conflict while merging main into sync/upstream. Resolve manually."
            git merge --abort
            exit 1
          fi

          # Bring in upstream changes.
          if git merge --no-ff --no-edit upstream/main; then
            echo "Merge succeeded."
          else
            echo "::error::Merge conflict while syncing upstream. Resolve manually on sync/upstream."
            git merge --abort
            exit 1
          fi

      - name: Push sync branch
        run: git push origin sync/upstream

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count main..sync/upstream)
          echo "Commits ahead of main: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then
            echo "No new commits to sync; skipping pull request."
            exit 0
          fi
          if gh pr view sync/upstream -R ${{ github.repository }} --json number >/dev/null 2>&1; then
            echo "Pull request already exists; branch push updated it."
          else
            gh pr create \
              -R ${{ github.repository }} \
              --base main \
              --head sync/upstream \
              --title "chore: sync upstream" \
              --body "Automated sync of upstream (tsukinaha/tsukimi) into this fork. Review and merge to bring upstream changes into main."
          fi
